<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stephanie römer – projects + about mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Caveat:wght@600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F6EC;--ink:#4A1A1F;--dk:#4A1A1F;--blue:#2C54A3;--lav:#DDE3F5;--pink:#FDC8EE;--lime:#C5D77A;--cream:#F2E8BE;--paper:#fff;--sh:0 10px 22px rgba(74,26,31,.16);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1215;--ink:#F5E6DC;--blue:#8fb0f0;--paper:#352730;--sh:0 10px 22px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45;overflow-x:hidden}
h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.mb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--ink)}
.mb button{font-weight:600;font-size:14px;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer}.mb button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.mb span{margin-left:auto;opacity:.65}
#site{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
.mob #site{width:390px;height:min(780px,calc(100vh - 110px));margin:16px auto;border:10px solid #111;border-radius:44px;overflow:auto;padding:20px 18px 50px;background:var(--bg)}
.mono{font:13px "Space Mono",monospace}.stub{opacity:.5;border:2px dashed currentColor;border-radius:14px;padding:10px 14px;margin:26px 0;text-align:center}
.hh{display:flex;justify-content:space-between;align-items:flex-start}.nmn{font-size:34px;line-height:1;color:var(--blue);font-weight:400}.hh nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.hh nav a{background:var(--lav);color:var(--dk);font-weight:600;padding:5px 14px;border-radius:12px;font-size:15px}
.m .nmn{font-size:26px}.m .hh nav a{padding:4px 10px;font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:110px 0 10px;scroll-margin-top:20px}.m .hd{margin-top:80px}.hd h2{font-size:34px;font-weight:400;color:var(--blue)}.hint{display:none;opacity:.75}.nh .hint{display:block}
.tg{display:inline-block;font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;color:var(--dk);margin:5px 5px 0 0;border:1px solid rgba(74,26,31,.15)}.tg.design{background:var(--pink)}.tg.code{background:var(--lime)}.tg.film{background:var(--cream)}
/* visuals */
.ph{font-size:var(--u,10px);width:11em;height:22em;border:.5em solid #111;border-radius:2.3em;background:linear-gradient(var(--a),var(--b));display:flex;flex-direction:column;gap:.7em;padding:2.8em .9em .9em;position:relative;box-shadow:0 .8em 2em rgba(0,0,0,.2);flex:none;color:#4A1A1F}
.ph:before{content:"";position:absolute;top:.7em;left:50%;width:3.4em;height:.9em;margin-left:-1.7em;background:#111;border-radius:1em}
.ph u{display:block;height:3em;border-radius:.8em;background:rgba(255,255,255,.7)}.ph u:last-child{margin-top:auto;height:2em;background:#2C54A3}
.ph .sl{font-size:1.5em;font-weight:800;color:#2C54A3;line-height:1}.pg{display:grid;grid-template-columns:1fr 1fr;gap:.6em;flex:1}.pg i{border-radius:.6em}
.bv{font-size:var(--u,10px);width:22em;height:17em;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:linear-gradient(160deg,#7d8bab,#2b3550);position:relative;overflow:hidden;box-shadow:0 .8em 2em rgba(0,0,0,.2);color:#fff;flex:none}
.bv:before{content:"";position:absolute;left:50%;top:3.2em;width:6em;height:6em;margin-left:-3em;border-radius:50%;background:rgba(255,255,255,.28)}
.bv:after{content:"";position:absolute;left:50%;bottom:-4em;width:13em;height:9em;margin-left:-6.5em;border-radius:50%;background:rgba(255,255,255,.22)}
.rc{position:absolute;left:3.4em;top:2.4em;font:1.1em "Space Mono",monospace;display:flex;gap:.5em;align-items:center}.rc:before{content:"";width:.8em;height:.8em;border-radius:50%;background:#ff4d6d;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.2}}
.lt{position:absolute;left:2.8em;bottom:2.6em;z-index:2;background:#fff;color:#2b3550;padding:.5em 1em;font-size:.95em;border-left:.4em solid #ff4d6d;line-height:1.2}.lt b{display:block}
.bv.y{background:#F2CF4A;color:#4A1A1F;border-radius:58% 42% 46% 54%/48% 56% 44% 52%;display:grid;place-items:center}.bv.y:before,.bv.y:after{display:none}.bv.y span{font-size:3.4em;font-weight:800}.bv.y em{position:absolute;right:2.6em;bottom:2.2em;font-style:normal;width:2em;height:2em;border-radius:50%;background:#4A1A1F;color:#F2CF4A;display:grid;place-items:center;font-size:1.3em}
/* project list */
.rw{--fs:clamp(54px,11vw,124px);display:flex;align-items:flex-end;gap:6px 20px;flex-wrap:wrap;padding:8px 0;margin-left:var(--ml);color:var(--blue);transition:opacity .25s;position:relative}
.rw .no{opacity:.75;color:var(--ink)}.rw .nm{font-size:var(--fs);font-weight:400;line-height:1;letter-spacing:-.02em;text-decoration:underline wavy transparent 5px;text-underline-offset:.1em;transition:color .25s,text-decoration-color .25s}.rw .mt{color:var(--ink);font-size:16px}.rw .no,.rw .mt{margin-bottom:calc(var(--fs)*.17)}
#site:not(.nh) .ls:hover .rw{opacity:.28}#site:not(.nh) .ls .rw:hover,.rw:focus-visible{opacity:1}.rw:hover .nm,.rw:focus-visible .nm,.rw.act .nm{color:var(--ink);text-decoration-color:var(--lime)}
.inl,.ar{display:none}
.nh .rw{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 14px;opacity:.6;padding:16px 0;margin-left:0}.nh .rw .no{position:absolute;top:22px;left:0}.nh .rw .nm{grid-column:1/-1;font-size:clamp(46px,14vw,72px);padding-top:26px}.m .rw .nm{font-size:56px}.nh .rw .no,.nh .rw .mt{margin-bottom:0}
.nh .inl{display:block;--u:5px;transform:rotate(-4deg) scale(.92);opacity:.85;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .3s;margin-right:6px}.nh .rw.act{opacity:1}.nh .rw.act .inl{transform:rotate(-4deg) scale(1.08);opacity:1}
.nh .ar{display:grid;position:absolute;right:0;top:18px;width:38px;height:38px;border-radius:50%;background:var(--lav);color:var(--dk);place-items:center;font-weight:800}.nh .rw.act .ar{background:var(--lime)}
.vf{position:fixed;left:0;top:0;width:84px;height:60px;margin:-30px 0 0 -42px;pointer-events:none;z-index:40;opacity:0;transition:opacity .2s}.vf i{position:absolute;width:14px;height:14px;border:3px solid var(--ink)}.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.pv{position:fixed;left:0;top:0;pointer-events:none;z-index:35;opacity:0;transition:opacity .25s}.pv>div{--u:11px;transform:rotate(-4deg)}
/* about */
.ab,.bo{display:grid;grid-template-columns:repeat(12,1fr);gap:34px 18px;margin-top:10px;align-items:start}.m .ab,.m .bo{display:flex;flex-direction:column;gap:30px}
.nt{padding:20px 22px;box-shadow:var(--sh);transform:rotate(var(--r));font-size:15px;color:var(--dk);transition:transform .3s}.nt:hover{transform:rotate(0) translateY(-4px)}.nt h3{font-size:19px;margin-bottom:6px}
.fold,.torn{box-shadow:none;filter:drop-shadow(0 8px 9px rgba(74,26,31,.2))}
.fold{clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
.torn{padding-bottom:32px;clip-path:polygon(0 0,100% 0,100% 95%,94% 100%,88% 95%,82% 100%,76% 95%,70% 100%,64% 95%,58% 100%,52% 95%,46% 100%,40% 95%,34% 100%,28% 95%,22% 100%,16% 95%,10% 100%,4% 95%,0 100%)}
.w{background:#fff;border-radius:8px;overflow:hidden;color:#222}.c{display:flex;gap:5px;align-items:center;padding:6px 8px;background:#eee;font-size:11px}.c i{width:9px;height:9px;border-radius:50%;background:#ccc}.c span{margin:0 auto;opacity:.6}
.pic{position:relative;overflow:hidden;background:linear-gradient(var(--g1,#b9c6dc),var(--g2,#9fb0cc));transition:background .5s}
.pic:before{content:"";position:absolute;left:50%;top:16%;width:18%;aspect-ratio:1;margin-left:-9%;border-radius:50%;background:#e9d5c2}.pic:after{content:"";position:absolute;left:50%;bottom:-14%;width:44%;height:38%;margin-left:-22%;border-radius:50%;background:#2b2b2b}
.pic .lv{position:absolute;left:10px;top:8px;z-index:1;font:12px "Space Mono",monospace;color:#fff;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:999px}
.pb{grid-column:1/5;background:var(--lime);--r:-3deg;padding:12px}
.bio{grid-column:5/10;background:var(--pink);--r:1.5deg}.bio h3{color:#ba1539;font-size:24px}.bio p+p{margin-top:8px}
.stk{grid-column:10/13;align-self:center;justify-self:center;width:130px;height:130px;background:#F2CF4A;color:var(--dk);clip-path:polygon(50% 0,61% 14%,79% 8%,80% 27%,98% 33%,88% 50%,98% 67%,80% 73%,79% 92%,61% 86%,50% 100%,39% 86%,21% 92%,20% 73%,2% 67%,12% 50%,2% 33%,20% 27%,21% 8%,39% 14%);display:grid;place-items:center;text-align:center;font:600 21px/1 Caveat,cursive;padding:24px;transform:rotate(8deg);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}.stk:hover{transform:rotate(32deg) scale(1.06)}
.n1{grid-column:1/5;background:#F4EFD8;--r:-2deg}.n2{grid-column:5/9;margin-top:34px;background:var(--lav);--r:1.5deg;border-radius:36px 8px 36px 8px}.n3{grid-column:9/13;background:#DCE8A8;--r:-1.5deg}.n4{grid-column:2/6;background:#F0E6B8;--r:2deg;border-radius:10px 30px 10px 30px}.tl2{grid-column:6/13}.m .n2{margin-top:0}
.ch{display:inline-block;background:rgba(255,255,255,.72);padding:2px 10px;border-radius:10px;font-size:13px;font-weight:600;margin:4px 4px 0 0;color:var(--dk)}
.tools{display:flex;flex-wrap:wrap;gap:14px 12px;margin-top:8px}.tb{display:flex;flex-direction:column;align-items:center;gap:4px;font:11px "Space Mono",monospace;width:62px;text-align:center}.tb i{font-style:normal;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--bgc);box-shadow:var(--sh)}
.arr{grid-column:1/-1;justify-self:center;width:140px;transform:rotate(60deg)}.m .stk,.m .arr{align-self:center}
.booth{border-radius:12px;grid-column:1/6;background:var(--rc,var(--lime));transition:background .5s;padding:12px;box-shadow:var(--sh);transform:rotate(-2deg);position:relative}.booth .stk{position:absolute;right:-30px;top:-44px;width:104px;height:104px;font-size:17px;padding:18px;z-index:2}.m .booth .stk{right:-6px}
.pic .idea{position:absolute;left:10px;right:10px;bottom:8px;z-index:1;font:11px "Space Mono",monospace;color:#fff;text-align:center;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px}
.strip{display:flex;gap:6px;padding:8px;background:#e6e6e6}.th{flex:1;min-width:0;border:0;background:none;padding:0;cursor:pointer;font:10px "Space Mono",monospace;color:#333;text-align:center}.th .pic{height:54px;border:2px solid transparent;border-radius:5px;margin-bottom:3px;transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}.th:hover .pic{border-color:rgba(74,26,31,.4)}.th[aria-pressed=true] .pic{border-color:var(--dk)}
.booth .stk{opacity:0;transform:scale(.4) rotate(-30deg);pointer-events:none;transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .4s}.booth.me .stk{opacity:1;transform:rotate(8deg);pointer-events:auto}.booth.me .stk:hover{transform:rotate(32deg) scale(1.06)}
.btxt{grid-column:6/13;align-self:start;padding:8px 0 0 20px;min-height:400px}.m .btxt{min-height:0;padding-left:0}.fd{animation:fo .45s}@keyframes fo{from{opacity:0}}
.btxt h3{font-size:clamp(28px,4vw,40px);font-weight:500;color:var(--blue);line-height:1.3;white-space:nowrap;transition:color .6s}.btxt h3.def{color:#ba1539}.m .btxt h3{font-size:25px}
.x{display:inline-block;overflow:hidden;white-space:pre;vertical-align:bottom;padding-bottom:.12em;margin-bottom:-.12em;width:0;opacity:0;transition:width .6s cubic-bezier(.65,0,.25,1),opacity .4s}
.def .hi,.def .nm{width:var(--w);opacity:1}h3:not(.def) .ra{width:var(--w);opacity:1}
.btxt mark{display:inline-block;vertical-align:bottom;overflow:hidden;white-space:nowrap;box-sizing:border-box;line-height:1.2;width:0;opacity:0;padding:0;border:1px solid transparent;border-radius:10px;font-weight:600;color:var(--dk);transition:width .6s cubic-bezier(.65,0,.25,1) .1s,opacity .4s .1s,padding .6s,background .5s,border-color .5s}h3:not(.def) mark{width:var(--mw);opacity:1;padding:0 10px;border-color:rgba(74,26,31,.15)}.rt{display:inline-block;animation:fo .4s}
.btxt p{margin:14px 0 0;font-size:17px;max-width:46ch}.btxt .lbl{display:block;margin:20px 0 6px;font:12px "Space Mono",monospace;opacity:.75}
.btxt .ch{background:var(--lav);margin:6px 6px 0 0}.btxt .tools{gap:12px 12px;margin-top:6px}.rp{display:inline-block;margin:6px 16px 0 0;border-bottom:3px solid var(--lime);font-weight:600}
.rpills{display:flex;flex-wrap:wrap;gap:8px}.rpill{background:transparent;border:1.5px solid rgba(74,26,31,.6);border-radius:999px;padding:4px 14px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .25s,border-color .25s,color .25s}.rpill:hover,.rpill:focus-visible,.rpill:active{background:var(--c);border-color:rgba(74,26,31,.15);color:var(--dk)}
.hero{position:relative;height:310px;margin:6px 0 0}.hero>*{position:absolute;margin:0}.hc{padding:12px 16px;border-radius:16px;box-shadow:var(--sh);font-weight:800;color:var(--dk);line-height:1.1}.hc small{display:block;font-weight:600;opacity:.7;font-size:12px}
.h1{left:14%;top:46px;background:#F2E8BE;transform:rotate(-6deg);font-size:22px}.h2{left:8%;top:150px;background:var(--blue);color:#fff;transform:rotate(-5deg);padding:26px 24px;font-size:24px;border-radius:20px}.h3{left:40%;top:130px;background:#fff;transform:rotate(4deg);font-size:30px}.h4{left:56%;top:50px;background:#F4EFD8;transform:rotate(5deg);font:800 22px "Space Mono",monospace;letter-spacing:.2em}
.hs{width:90px;height:90px}.hr{right:2%;bottom:20px;color:var(--blue);font-size:clamp(30px,5vw,48px);line-height:1;text-align:right}.hcap{left:0;bottom:-8px;opacity:.5}
.m .hero{height:270px}.m .h1{left:4%}.m .h4{display:none}.m .h3{left:36%;top:140px;font-size:22px}.m .hr{font-size:28px}
.ct{position:relative;margin-top:110px;min-height:420px}.cb{max-width:440px;padding:12px 18px;border-radius:22px;font-size:17px;margin:0 0 14px;width:max-content}.cb.g{background:#E6DFCE;color:var(--dk);border-bottom-left-radius:4px}.cb.b{background:var(--blue);color:#fff;margin-left:50px;border-bottom-right-radius:4px;width:auto}
.env{position:absolute;right:8%;top:50px;width:240px;height:150px;background:#C9D0EC;border-radius:8px;transform:rotate(-4deg);box-shadow:var(--sh)}.env:before{content:"";position:absolute;inset:0;background:#B3BDE6;clip-path:polygon(0 0,100% 0,50% 58%);border-radius:8px}.li{position:absolute;right:-22px;bottom:-24px;width:46px;height:46px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.sq{position:absolute;left:36%;bottom:100px;width:150px;transform:rotate(-10deg)}.up{position:absolute;right:0;bottom:50px}
.fp{background:var(--lav);padding:6px 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--dk)}.ft{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:60px}.ft .fp{min-height:40px;display:inline-flex;align-items:center}
.ct2{margin-top:110px;display:grid;grid-template-columns:1.2fr .8fr;gap:10px 40px;align-items:start}.ct2 .cb.b{margin-left:0}.dv{text-align:right;opacity:.6;margin:-4px 4px 16px}
.qr{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.q{border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 18px;min-height:44px;display:inline-flex;align-items:center;font-weight:600;transition:background .2s,color .2s}.q:hover,.q:focus-visible,.q.p{background:var(--blue);color:#fff}
.mr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.mr .mono{font-size:15px}.cp{border:0;border-radius:999px;background:var(--lav);color:var(--dk);font-weight:600;padding:5px 14px;cursor:pointer}
.ct2 .env{position:relative;right:auto;top:auto;justify-self:center;margin-top:20px;transition:transform .3s}.ct2 .env:hover{transform:rotate(-4deg) translateY(-8px)}
.m .ct{min-height:0}.m .ct,.m .ct2{margin-top:80px}.m .bo{margin-top:80px!important}.m .env{position:relative;right:auto;top:auto;margin:20px auto 40px;width:200px;height:125px}.m .sq{display:none}.m .up{position:static;display:inline-block;margin-top:16px}.m .ct2{grid-template-columns:1fr}.m .cb{max-width:100%}.m .ft .r{margin-left:0}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.evw{justify-self:center;margin-top:100px}.ev{position:relative;width:270px;height:170px;background:#B3BDE6;border-radius:8px;transform:rotate(-3deg);box-shadow:var(--sh);perspective:800px;cursor:pointer}
.ev .pp{position:absolute;left:16px;right:16px;top:12px;height:140px;background:#fff;color:var(--dk);border:0;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;padding:16px 8px 0;gap:3px;font:inherit;cursor:pointer;z-index:1;pointer-events:none;transition:transform .9s cubic-bezier(.3,1.2,.4,1) .45s}
.ev .ef{position:absolute;inset:0;background:#A3B0DE;border-radius:8px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2;pointer-events:none}
.ev .fl{position:absolute;left:0;right:0;top:0;height:55%;background:#8E9DD3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s,z-index 0s .25s;z-index:3;pointer-events:none}
.ev.open .fl{transform:rotateX(180deg);z-index:0}.ev.open .pp{transform:translateY(-96px);pointer-events:auto}
.em{font:700 15px "Space Mono",monospace;margin-top:2px;word-break:break-all}.cpl{margin-top:8px;font:600 13px "Bricolage Grotesque",sans-serif;border:1.5px solid var(--blue);color:var(--blue);border-radius:999px;padding:2px 14px;transition:background .2s,color .2s}.ev .pp:hover .cpl,.ev .pp:focus-visible .cpl{background:var(--blue);color:#fff}
.m .evw{margin:100px 0 20px}.m .ev{transform:rotate(-3deg) scale(.92)}
.fltw{position:sticky;bottom:18px;height:0;z-index:20;pointer-events:none}.fltw a{position:absolute;right:0;bottom:0;pointer-events:auto;width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:var(--sh);opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;visibility:hidden}.fltw a.on{opacity:1;transform:none;visibility:visible}
.mb{flex-wrap:wrap}
/* detail */
.back{display:inline-block;margin:26px 0 8px;font-weight:600;border-bottom:3px solid var(--lime)}
.dt{margin:0 -20px;padding:34px 20px 20px;background:radial-gradient(color-mix(in srgb,var(--ink) 22%,transparent) 1.5px,transparent 1.5px) 0 0/26px 26px}.m .dt{margin:0 -18px;padding:34px 16px 20px}
