<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stephanie römer – about me + contact</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;800&family=Caveat:wght@600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F6EC;--ink:#4A1A1F;--dk:#4A1A1F;--blue:#2C54A3;--lav:#DDE3F5;--pink:#FDC8EE;--lime:#C5D77A;--cream:#F2E8BE;--sh:0 10px 22px rgba(74,26,31,.16);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1215;--ink:#F5E6DC;--blue:#8fb0f0;--sh:0 10px 22px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45;overflow-x:hidden}
h3,p{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.mb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--ink)}
.mb button{font-weight:600;font-size:14px;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer}.mb button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#site{--px:20px;max-width:1000px;margin:0 auto;padding:50px var(--px) 60px}
.mob #site{--px:18px;width:390px;height:min(780px,calc(100vh - 110px));margin:16px auto;border:10px solid #111;border-radius:44px;overflow:auto;padding:0 var(--px) 50px;background:var(--bg)}
.mono{font:13px "Space Mono",monospace}
/* photo booth */
.bo{display:grid;grid-template-columns:repeat(12,1fr);gap:34px 18px;align-items:start}.m .bo{display:flex;flex-direction:column;align-items:stretch;gap:30px}
.booth{grid-column:1/6;background:var(--rc,var(--lime));transition:background .5s;border-radius:12px;padding:12px;box-shadow:var(--sh);transform:rotate(-2deg);position:relative}
.w{background:#fff;border-radius:8px;overflow:hidden;color:#222}.c{display:flex;gap:5px;align-items:center;padding:6px 8px;background:#eee;font-size:11px}.c i{width:9px;height:9px;border-radius:50%;background:#ccc}.c span{margin:0 auto;opacity:.75}
.pic{position:relative;overflow:hidden;background:linear-gradient(var(--g1,#4A6FB5),var(--g2,#263D73));transition:background .5s}
.pic:before{content:"";position:absolute;left:50%;top:16%;width:18%;aspect-ratio:1;margin-left:-9%;border-radius:50%;background:#e9d5c2}.pic:after{content:"";position:absolute;left:50%;bottom:-14%;width:44%;height:38%;margin-left:-22%;border-radius:50%;background:#2b2b2b}
.idea{position:absolute;left:10px;right:10px;bottom:8px;z-index:1;font:11px "Space Mono",monospace;color:#fff;text-align:center;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px}
#live{aspect-ratio:16/10;touch-action:pan-y}
.strip{display:flex;gap:6px;padding:8px;background:#e6e6e6}.th{flex:1;min-width:0;border:0;background:none;padding:0;cursor:pointer;font:10px "Space Mono",monospace;color:#333;text-align:center}.th .pic{aspect-ratio:16/10;border:2px solid transparent;border-radius:5px;margin-bottom:3px}.th:hover .pic{border-color:rgba(74,26,31,.4)}.th[aria-pressed=true]{font-weight:700;color:#000}.th[aria-pressed=true] .pic{border-color:var(--dk)}
.stk{position:absolute;right:-30px;top:-44px;width:104px;height:104px;background:#F2CF4A;color:var(--dk);clip-path:polygon(50% 0,61% 14%,79% 8%,80% 27%,98% 33%,88% 50%,98% 67%,80% 73%,79% 92%,61% 86%,50% 100%,39% 86%,21% 92%,20% 73%,2% 67%,12% 50%,2% 33%,20% 27%,21% 8%,39% 14%);display:grid;place-items:center;text-align:center;font:600 17px/1 Caveat,cursive;padding:18px;z-index:2;opacity:0;transform:scale(.4) rotate(-30deg);pointer-events:none;transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .4s}
.booth.me .stk{opacity:1;transform:rotate(8deg);pointer-events:auto}.booth.me .stk:hover{transform:rotate(32deg) scale(1.06)}.m .stk{display:none}
.m .booth{margin:0 calc(var(--px)*-1);transform:none;border-radius:0}.m .idea{font-size:10px}.m .th{font-size:9px}
.btxt{grid-column:6/13;align-self:start;padding:8px 0 0 20px;min-height:420px}.m .btxt{min-height:0;padding-left:0}
.fd{animation:fo .45s}@keyframes fo{from{opacity:0}}
.btxt h3{display:flex;flex-wrap:wrap;align-items:baseline;font-size:clamp(28px,4vw,40px);font-weight:500;color:var(--blue);line-height:1.35}.m .btxt h3{font-size:clamp(22px,6.5vw,26px)}.sp{white-space:pre}
.x{display:block;flex:none;overflow:hidden;white-space:pre;width:0;opacity:0;transition:width .6s cubic-bezier(.65,0,.25,1),opacity .4s}
.def .hi,.def .nm{width:var(--w);opacity:1}h3:not(.def) .ra{width:var(--w);opacity:1}
.btxt mark{display:block;flex:none;overflow:hidden;white-space:nowrap;box-sizing:border-box;line-height:1.2;width:0;opacity:0;padding:0;border:1px solid transparent;border-radius:10px;font-weight:600;color:var(--dk);transition:width .6s cubic-bezier(.65,0,.25,1) .1s,opacity .4s .1s,padding .6s,background .5s,border-color .5s}
h3:not(.def) mark{width:var(--mw);opacity:1;padding:0 10px;border-color:rgba(74,26,31,.15)}.rt{display:inline-block;animation:fo .4s}
.btxt p{margin:14px 0 0;font-size:17px;max-width:46ch}.lbl{display:block;margin:20px 0 6px;font:12px "Space Mono",monospace;opacity:.75}
.ch{display:inline-block;background:var(--lav);color:var(--dk);padding:2px 10px;border-radius:10px;font-size:13px;font-weight:600;margin:6px 6px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}.tb{display:flex;flex-direction:column;align-items:center;gap:4px;font:11px "Space Mono",monospace;width:62px;text-align:center}.tb i{font-style:normal;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--bgc);box-shadow:var(--sh)}
.rpills{display:flex;flex-wrap:wrap;gap:8px}.rpill{background:transparent;border:1.5px solid rgba(74,26,31,.6);border-radius:999px;padding:4px 14px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .25s,border-color .25s,color .25s}.rpill:hover,.rpill:focus-visible,.rpill:active{background:var(--c);border-color:rgba(74,26,31,.15);color:var(--dk)}
.rn{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.rn button{border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:600;font-size:14px;background:transparent;cursor:pointer;transition:background .2s,color .2s}.rn button:hover{background:var(--ink);color:var(--bg)}
/* contact */
.ct2{margin-top:110px;display:grid;grid-template-columns:1.2fr .8fr;gap:10px 40px;align-items:start}.m .ct2{grid-template-columns:1fr;margin-top:80px}
.cb{max-width:440px;padding:12px 18px;border-radius:22px;font-size:17px;margin:0 0 14px;width:max-content}.cb.g{background:#E6DFCE;color:var(--dk);border-bottom-left-radius:4px}.cb.b{background:var(--blue);color:#fff;border-bottom-right-radius:4px;width:auto}.m .cb{max-width:100%}
.qr{display:flex;justify-content:flex-end}
.lk{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px 0 8px;border-radius:999px;background:#0A66C2;color:#fff;font-weight:600;transition:background .2s}.lk i{font-style:normal;background:#fff;color:#0A66C2;font-weight:800;border-radius:6px;width:30px;height:30px;display:grid;place-items:center;font-size:17px}.lk:hover,.lk:focus-visible{background:#004182}
.evw{justify-self:center;margin-top:100px}.m .evw{margin:100px 0 20px}
.ev{position:relative;width:270px;height:170px;background:#B3BDE6;border-radius:8px;transform:rotate(-3deg);box-shadow:var(--sh);perspective:800px;cursor:pointer}.m .ev{transform:rotate(-3deg) scale(.92)}
.ev .pp{position:absolute;left:16px;right:16px;top:12px;height:140px;background:#fff;color:#4A1A1F;border:0;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;padding:16px 8px 0;gap:3px;font:inherit;cursor:pointer;z-index:1;pointer-events:none;transition:transform .9s cubic-bezier(.3,1.2,.4,1) .45s}
.ev .ef{position:absolute;inset:0;background:#A3B0DE;border-radius:8px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2;pointer-events:none}
.ev .fl{position:absolute;left:-.5px;right:-.5px;top:-1px;height:calc(55% + 1px);background:#A3B0DE;border-radius:8px 8px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .55s cubic-bezier(.5,0,.3,1),background .55s,z-index 0s .28s;z-index:3;pointer-events:none}
.ev.open .fl{transform:rotateX(180deg);z-index:0;background:#8E9DD3}.ev.open .pp{transform:translateY(-96px);pointer-events:auto}
.em{font:700 15px "Space Mono",monospace;margin-top:2px;word-break:break-all}.cpl{margin-top:8px;font:600 13px "Bricolage Grotesque",sans-serif;border:1.5px solid var(--blue);color:var(--blue);border-radius:999px;padding:2px 14px;transition:background .2s,color .2s}.ev .pp:hover .cpl,.ev .pp:focus-visible .cpl{background:var(--blue);color:#fff}
.ft{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:60px}.fp{background:var(--lav);padding:6px 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--dk);min-height:40px;display:inline-flex;align-items:center}
.fltw{position:sticky;bottom:18px;height:0;z-index:20;pointer-events:none}.fltw a{position:absolute;right:0;bottom:0;pointer-events:auto;border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:600;font-size:14px;background:var(--bg);color:var(--ink);box-shadow:var(--sh);opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s,background .2s,color .2s;visibility:hidden;white-space:nowrap}.fltw a.on{opacity:1;transform:none;visibility:visible}.fltw a:hover{background:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style></head><body>
<div class="mb" id="mb"><button data-m="d" aria-pressed="true">desktop</button><button data-m="m" aria-pressed="false">mobile</button></div>
<div id="stage"><div id="site"></div></div>
<script>
const TL={Figma:['Fg','#1e1e1e','#fff'],Illustrator:['Ai','#330000','#FF9A00'],InDesign:['Id','#49021F','#FF3366'],'Premiere Pro':['Pr','#00005B','#9999FF'],'After Effects':['Ae','#00005B','#9999FF'],HTML:['<>','#e44d26','#fff'],CSS:['#','#2965f1','#fff'],JS:['JS','#f7df1e','#222'],Vue:['V','#41b883','#fff']};
const tools=a=>a.length?`<span class="lbl">tools</span><div class="tools">${a.map(n=>{const[x,b,c]=TL[n];return `<span class="tb"><i style="--bgc:${b};color:${c}">${x}</i>${n}</span>`}).join('')}</div>`:'';
const chs=a=>a.map(x=>`<span class="ch">${x}</span>`).join('');
const ME={k:'stephanie',sh:'me',g:['#4A6FB5','#263D73'],idea:'[photo: you, looking at the camera]'};
const R=[
{k:'ux/ui designer',sh:'ux/ui',g:['#C5D77A','#a9bd5e'],idea:'[photo idea: at the laptop, wireframes behind you]',t:'From first sketches and user flows to prototypes and frontend builds: I design interfaces that make sense and look good.',sk:['user research','user flows','wireframes','prototyping','UI design'],tl:['Figma','HTML','CSS','JS','Vue']},
{k:'graphic designer',sh:'graphic',g:['#FDC8EE','#f4a9dd'],idea:'[photo idea: sketching on a tablet or paper]',t:'Layout, typography, colour and illustration that make a project feel like one world.',sk:['layout & typography','colour','illustration','visual identity'],tl:['Illustrator','InDesign','Figma']},
{k:'filmmaker',sh:'film',g:['#F2E8BE','#e6d589'],idea:'[photo idea: behind the camera]',t:'From first idea to final cut: I direct and edit short films and series.',sk:['directing','editing','motion graphics','storytelling'],tl:['Premiere Pro','After Effects']},
{k:'multimedia producer',sh:'producer',g:['#DDE3F5','#bcc9ec'],idea:'[photo idea: planning with a clipboard or schedule]',t:'Where it all comes together: planning, producing and managing digital content across video, web and social.',sk:['production assistance','content management','content planning','post-production'],tl:['Premiere Pro','Figma']}];
const ALL=[ME,...R];let role=-1,mob=false;
const $=id=>document.getElementById(id);
const site=$('site'),stage=$('stage'),framed=()=>stage.classList.contains('mob');
function about(){return `<div class="bo" id="about"><div class="booth me nd"><div class="stk">laptop + playlist = happy</div><div class="w"><div class="c"><i></i><i></i><i></i><span id="wt">Photo Booth</span></div><div class="pic" id="live"><span class="idea" id="idea"></span></div><div class="strip">${ALL.map((r,i)=>`<button class="th" data-role="${i-1}" aria-pressed="false" aria-label="${r.k}"><div class="pic" style="--g1:${r.g[0]};--g2:${r.g[1]}"></div>${r.sh}</button>`).join('')}</div></div></div><div class="btxt" id="bt" aria-live="polite"><h3 id="hh" class="def"><span class="x hi">hi, </span><span class="sp">i’m </span><span class="x nm">stephanie!</span><span class="x ra">a </span><mark id="rm"><span class="rt" id="rt"></span></mark></h3><div id="bd"></div></div></div>`}
function setMW(){const m=$('rm'),t=$('rt');if(m&&t&&role>=0)m.style.setProperty('--mw',(t.offsetWidth+22)+'px')}
function measH(){const h=$('hh');if(!h)return;h.querySelectorAll('.x').forEach(e=>{e.style.transition='none';e.style.width='auto';const w=e.offsetWidth;e.style.width='';void e.offsetWidth;e.style.transition='';e.style.setProperty('--w',(w+1)+'px')});setMW()}
function paint(){const r=ALL[role+1],l=$('live');if(!l)return;l.style.setProperty('--g1',r.g[0]);l.style.setProperty('--g2',r.g[1]);$('wt').textContent=role<0?'Photo Booth':r.k;$('idea').textContent=r.idea;
const bo=document.querySelector('.booth');bo.style.setProperty('--rc',role<0?'var(--lime)':r.g[0]);bo.classList.toggle('me',role<0);
const hh=$('hh');if(!hh._m){measH();hh._m=1}hh.classList.toggle('def',role<0);
if(role>=0){const m=$('rm'),t=$('rt');t.textContent=r.k;m.style.background=r.g[0];t.style.animation='none';void t.offsetWidth;t.style.animation='';setMW()}
const last=role==R.length-1,pv=role==0?'me':(R[role-1]||{}).k,nx=last?'back to me':(R[role+1]||{}).k;
$('bd').innerHTML=role<0?`<div class="fd"><p>A UX/UI designer with a filmmaker’s eye, working where design, film and content meet.</p><span class="lbl">what I do</span><div class="rpills">${R.map((x,i)=>`<button class="rpill" data-role="${i}" style="--c:${x.g[0]}">${x.k}</button>`).join('')}</div></div>`:`<div class="fd"><p>${r.t}</p><span class="lbl">skills</span><div>${chs(r.sk)}</div>${tools(r.tl)}<div class="rn"><button data-step="-1">← ${pv}</button><button data-step="1">${nx} ${last?'↺':'→'}</button></div></div>`;
document.querySelectorAll('.th').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.role==role))}
function step(n){role=((role+1+n+ALL.length)%ALL.length)-1;document.querySelector('.booth').classList.remove('nd');paint()}
const FT='<div class="ft"><span class="fp">© 2026 stephanie römer</span><a class="fp" href="#contact">imprint &amp; privacy</a><a class="fp" href="#contact" lang="de" hreflang="de" aria-label="deutsche version">de</a></div>';
const contact=()=>`<section id="contact" class="ct2"><div><div class="cb g">let’s get in touch!</div><div class="cb b">want to work together? just saying hi? whatever it is, I’d love to hear from you.</div><div class="qr"><a class="lk" href="#contact"><i>in</i>LinkedIn</a></div></div><div class="evw"><div class="ev"><button class="pp" id="cp" aria-label="copy email address"><span class="mono">write to me</span><b class="em">hello@[your-domain]</b><span class="cpl">click to copy</span></button><span class="ef"></span><span class="fl"></span></div></div></section>`+FT+'<div class="fltw"><a id="toTop" href="#top">back to top ↑</a></div>';
function envInit(){const ev=site.querySelector('.ev');if(!ev)return;if(matchMedia('(prefers-reduced-motion:reduce)').matches||!window.IntersectionObserver){ev.classList.add('open');return}new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){ev.classList.add('open');o.disconnect()}}),{threshold:.6}).observe(ev)}
function render(){site.innerHTML=about()+contact();paint();envInit()}
function modes(){const nar=innerWidth<780,m=mob||nar;site.classList.toggle('m',m);stage.classList.toggle('mob',mob&&!nar);$('mb').style.display=nar?'none':'flex'}
function updateTop(){const b=$('toTop');if(b)b.classList.toggle('on',(framed()?site.scrollTop:scrollY)>500)}
site.addEventListener('click',e=>{const s=e.target.closest('[data-step]');if(s)return step(+s.dataset.step);const r=e.target.closest('[data-role]');if(r){role=+r.dataset.role;document.querySelector('.booth').classList.remove('nd');return paint()}
const c=e.target.closest('#cp');if(c){try{navigator.clipboard&&navigator.clipboard.writeText('hello@your-domain')}catch(x){}const l=c.querySelector('.cpl');l.textContent='copied ✓';setTimeout(()=>l.textContent='click to copy',1500)}
const v=e.target.closest('.ev');if(v&&!e.target.closest('.pp'))v.classList.toggle('open');
if(e.target.closest('#toTop')){e.preventDefault();framed()?site.scrollTo({top:0,behavior:'smooth'}):scrollTo({top:0,behavior:'smooth'})}});
site.addEventListener('keydown',e=>{if(e.target.closest('.booth')&&(e.key=='ArrowLeft'||e.key=='ArrowRight'))step(e.key=='ArrowRight'?1:-1)});
let sx=null;site.addEventListener('pointerdown',e=>{sx=e.target.closest('#live')&&!e.target.closest('.sa')?e.clientX:null});
site.addEventListener('pointerup',e=>{if(sx!==null){const d=e.clientX-sx;if(Math.abs(d)>40)step(d<0?1:-1);sx=null}});
addEventListener("scroll",updateTop,{passive:true});site.addEventListener("scroll",updateTop,{passive:true});addEventListener('resize',()=>{modes();measH();updateTop()});
document.querySelectorAll('#mb [data-m]').forEach(b=>b.onclick=()=>{mob=b.dataset.m=='m';document.querySelectorAll('#mb [data-m]').forEach(x=>x.setAttribute('aria-pressed',x==b));modes();measH();updateTop()});
render();modes();measH();document.fonts&&document.fonts.ready.then(measH);
</script></body></html>
